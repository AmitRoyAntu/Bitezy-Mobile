name: Bitezy CI/CD Pipeline

'on':
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ==============================================================
  # Job 1: Backend CI (Node.js & Express API)
  # ==============================================================
  backend-ci:
    name: Backend CI (Node.js & Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Server Syntax
        run: node -c server.js

      - name: Run Backend Unit & Integration Tests
        env:
          JWT_SECRET: test_jwt_secret_ci_environment_12345
          NODE_ENV: test
        run: npm test

  # ==============================================================
  # Job 2: AI Service CI (Python & FastAPI)
  # ==============================================================
  ai-service-ci:
    name: AI Service CI (FastAPI & Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Validate Python Syntax
        run: python -m py_compile main.py config.py database.py

      - name: Lint Python Codebase (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ==============================================================
  # Job 3: Frontend CI (React Native & Expo)
  # ==============================================================
  frontend-ci:
    name: Frontend CI (React Native & Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Validate Core Entry Syntax
        run: node -c index.js

      - name: Verify Web Bundle Export (Dry-Run)
        run: npx expo export --platform web --no-minify

  # ==============================================================
  # Job 4: Continuous Deployment (CD) - Gated to Main Branch
  # ==============================================================
  continuous-deployment:
    name: Deploy to Production Cloud VPS
    needs: [backend-ci, ai-service-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Deploying latest commit to production server..."
            cd /opt/bitezy-app || exit 1
            git pull origin main
            cd backend && npm ci --production
            pm2 reload bitezy-backend --update-env
            cd ../ai-service && pip install -r requirements.txt
            sudo systemctl restart bitezy-ai.service || true
            curl -f http://localhost:8002/ || exit 1
            echo "Deployment successfully completed!"
