name: Bitezy CI Pipeline

'on':
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ==============================================================
  # Job 1: Backend CI (Node.js & Express API)
  # ==============================================================
  backend-ci:
    name: Backend CI (Node.js & Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Server Syntax
        run: node -c server.js

      - name: Run Backend Unit & Integration Tests
        env:
          JWT_SECRET: test_jwt_secret_ci_environment_12345
          NODE_ENV: test
        run: npm test

  # ==============================================================
  # Job 2: AI Service CI (Python & FastAPI)
  # ==============================================================
  ai-service-ci:
    name: AI Service CI (FastAPI & Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Validate Python Syntax
        run: python -m py_compile main.py config.py database.py

      - name: Lint Python Codebase (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ==============================================================
  # Job 3: Frontend CI (React Native & Expo)
  # ==============================================================
  frontend-ci:
    name: Frontend CI (React Native & Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Validate Core Entry Syntax
        run: node -c index.js

      - name: Verify Web Bundle Export (Dry-Run)
        run: npx expo export --platform web --no-minify
